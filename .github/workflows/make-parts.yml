name: Make TikTok parts

on:
  schedule:
    - cron: "17 14 * * *"   # once a day, about 3am New Zealand time (GitHub may start it a little late)
  workflow_dispatch:         # "Run workflow" button; the Google Drive watcher also starts it this way

concurrency:
  group: make-parts
  cancel-in-progress: false

jobs:
  make-parts:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      # ---- settings you can change ----
      # Every movie is made in each of these, each into its own subfolder of "Ready to post/<movie>":
      #   highlights = "Highlights" (best moments), stretch = "Best stretch" (best few minutes back to back),
      #   all = "Whole movie" (everything back to back). Remove one to skip it, e.g. "highlights,stretch"
      MODES: "highlights,stretch"
      STRETCH_MINUTES: "12"     # best stretch mode: how many minutes of the movie to use
      STRETCH_PART_SECONDS: "75" # best stretch mode: length of each part
      HIGHLIGHT_SECONDS: "75"   # highlights mode: length of each clip
      HIGHLIGHT_COUNT: "0"      # highlights mode: how many clips (0 = automatic, about 1 per 10 minutes)
      PART_SECONDS: "120"       # all mode: length of each part (2 minutes)
      CUT_EARLIEST: "25"        # all mode: may end a part up to 25s early to land on a pause...
      CUT_LATEST: "15"          # ...or up to 15s late
      FLIP: "mirror"            # "none", "mirror" (left-right), "upsidedown", or "both"
      AUTO_SUBTITLES: "on"      # "on" = make English subtitles from the audio when there's no .srt, "off" = don't
      WHISPER_MODEL: "small"    # speech model: "base" (faster), "small" (good), "medium" (best but slow)
      LINE: "on"                # a short thin black line on the movie (near its bottom), sliding left and right
      LINE_WIDTH: "360"         # its length in pixels (the video is 1080 wide)
      LINE_THICKNESS: "1"       # its thickness in pixels
      COCKROACH: "on"           # a little cockroach scuttles across the screen at a random moment
      COCKROACH_CHANCE: "1"     # chance each part gets one (1 = every part, 0.5 = half of them)
      COCKROACH_SIZE: "100"     # how long it is in pixels (the video is 1080 wide)
      FLIP_EVERY: "150"         # switch normal/flipped on a scene cut, at most once every 150s (2.5 min); "-1" = on every cut; "0" = flipped all the time
      CAPTIONS: "on"            # put a ready-to-post caption in each "Part X ready" notification
      # ---- phone notifications: the ntfy name is in the private file "notification name.txt" in the Drive folder ----
      # ---- Google Drive: the "TikTok automation" folder ----
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive
      RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: "1nk5jCp9xOYGOO1m4KUPKqSUdtQOGfUFf"
      RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      RCLONE_CONFIG_GDRIVE_TOKEN: '{"access_token":"","token_type":"Bearer","refresh_token":"${{ secrets.GDRIVE_REFRESH_TOKEN }}","expiry":"2000-01-01T00:00:00Z"}'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Keep the speech model between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ env.WHISPER_MODEL }}

      - name: Install the subtitle maker (Whisper)
        run: pip install faster-whisper

      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Check Google Drive connection
        run: "rclone lsd gdrive:"

      - name: Make parts
        run: python3 process.py

      - name: Tell my phone if something broke
        if: failure() || cancelled()
        run: |
          curl -s -H "Title: Movie run stopped" -H "Tags: warning" \
            -d "The GitHub run failed or was cancelled. Open the GitHub app > movie-splitter > Actions to see why." \
            "https://ntfy.sh/$(rclone cat 'gdrive:notification name.txt' | tr -d '[:space:]')" || true
