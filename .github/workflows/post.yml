name: Post to TikTok

# Every hour this checks whether a part is due (settings.json "posting": enabled, times, per_day,
# timezone) and, if so, posts the next one to TikTok through Composio. Switched off by default.
#
# Secrets to set once (GitHub > repo > Settings > Secrets and variables > Actions):
#   GDRIVE_CLIENT_ID, GDRIVE_CLIENT_SECRET, GDRIVE_REFRESH_TOKEN, GDRIVE_ROOT_FOLDER_ID   (same as the cutter)
#   COMPOSIO_API_KEY        from composio.dev > Settings > API keys
#   COMPOSIO_USER_ID        the user id you connected TikTok under in Composio (e.g. your email)
# Optional:
#   COMPOSIO_CONNECTED_ACCOUNT_ID   pick one exact TikTok connection (starts with "ca_")
#   TIKTOK_USERNAME                 your @name, so the app can link to public posts
#   COMPOSIO_TIKTOK_VERSION         pin a Composio TikTok toolkit version (default "latest")

on:
  schedule:
    - cron: "3 * * * *"      # every hour, a few minutes past (GitHub may start it a little late)
  workflow_dispatch:
    inputs:
      force:
        description: "Post the next part now, ignoring the schedule"
        type: boolean
        default: false
      dry_run:
        description: "Only show what would be posted"
        type: boolean
        default: false

concurrency:
  group: post-tiktok
  cancel-in-progress: false

permissions:
  contents: write            # saves the post result to the "status" branch

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive
      RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID || vars.GDRIVE_ROOT_FOLDER_ID }}
      RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      RCLONE_CONFIG_GDRIVE_TOKEN: '{"access_token":"","token_type":"Bearer","refresh_token":"${{ secrets.GDRIVE_REFRESH_TOKEN }}","expiry":"2000-01-01T00:00:00Z"}'
      GITHUB_TOKEN: ${{ github.token }}
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
      COMPOSIO_CONNECTED_ACCOUNT_ID: ${{ secrets.COMPOSIO_CONNECTED_ACCOUNT_ID }}
      COMPOSIO_TIKTOK_VERSION: ${{ vars.COMPOSIO_TIKTOK_VERSION || 'latest' }}
      TIKTOK_USERNAME: ${{ vars.TIKTOK_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Is posting switched on?
        id: check
        run: |
          python3 -c "import settings; print('enabled=' + ('yes' if settings.load()['posting']['enabled'] else 'no'))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.check.outputs.enabled == 'yes' || inputs.force
        with:
          python-version: "3.12"

      - name: Install Composio and rclone
        if: steps.check.outputs.enabled == 'yes' || inputs.force
        run: |
          pip install composio
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Post the next part if one is due
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python3 poster.py $ARGS
