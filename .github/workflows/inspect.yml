name: Inspect a part (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive
      RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: "1nk5jCp9xOYGOO1m4KUPKqSUdtQOGfUFf"
      RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      RCLONE_CONFIG_GDRIVE_TOKEN: '{"access_token":"","token_type":"Bearer","refresh_token":"${{ secrets.GDRIVE_REFRESH_TOKEN }}","expiry":"2000-01-01T00:00:00Z"}'
    steps:
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash && sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Grab frames
        run: |
          mkdir sheets
          for n in 01 02 03; do
            rclone copyto "gdrive:Ready to post/whatifs1e8/whatifs1e8 - Part $n.mp4" p$n.mp4
            echo "::notice::Part $n: $(ffprobe -v error -show_entries stream=codec_type,width,height,duration -of csv=p=0 p$n.mp4 | tr '\n' ' ')"
            # one frame every 3 seconds, 25 frames in a 5x5 grid
            ffmpeg -loglevel error -i p$n.mp4 -vf "fps=1/3,scale=216:384,tile=5x5" -frames:v 1 sheets/part$n.png
          done
          # full-size frames from part 1 for detail
          for t in 10 30 50; do ffmpeg -loglevel error -ss $t -i p01.mp4 -frames:v 1 -vf scale=540:-1 sheets/p01_$t.png; done
      - name: Save to a temporary branch
        run: |
          cd sheets && git init -q && git checkout -q -b inspect-output
          git config user.name test && git config user.email test@example.com
          git add . && git commit -qm frames
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" inspect-output
