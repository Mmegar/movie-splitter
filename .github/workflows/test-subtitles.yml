name: Test subtitles (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FLIP: "mirror"
      FLIP_EVERY: "-1"
      WHISPER_MODEL: "small"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small
      - run: pip install faster-whisper
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core espeak-ng
      - name: Make test clips
        run: |
          espeak-ng -s 140 -w en.wav "Hello there. I think we should leave this house before the sun goes down. Do you hear me?"
          espeak-ng -v es -s 130 -w es.wav "Hola amigo. Tenemos que salir de esta casa antes de que llegue la noche. Me escuchas?"
          for L in en es; do
            ffmpeg -loglevel error -y -f lavfi -i testsrc=size=640x360:rate=30:duration=9 -i $L.wav -af apad -t 9 -shortest test_$L.mp4
          done
      - name: Run splitter on them
        run: |
          for L in en es; do
            MODE=all PART_SECONDS=100 python3 process.py --local test_$L.mp4 2>&1 | tee -a run.log
          done
          grep -E "spoken language|subtitles:|^    [0-9]|no automatic|Error" run.log | while IFS= read -r l; do echo "::notice::$l"; done
          ls -la out
          for f in out/*.mp4; do ffmpeg -loglevel error -y -ss 4 -i "$f" -frames:v 1 "${f%.mp4}.png"; done
      - name: Save frames to a temporary branch
        run: |
          mkdir /tmp/f && cp out/*.png /tmp/f/
          git config user.name test && git config user.email test@example.com
          git checkout --orphan test-output && git rm -rqf . && cp /tmp/f/*.png . && git add *.png
          git commit -qm frames && git push -f origin test-output
