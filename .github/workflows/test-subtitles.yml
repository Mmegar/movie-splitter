name: Test subtitles (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modes-test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small
      - run: pip install faster-whisper
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core espeak-ng
      - name: Make a test movie with speech, letterboxed
        run: |
          espeak-ng -s 140 -w a.wav "Hello there. I think we should leave this house before the sun goes down."
          espeak-ng -s 140 -w b.wav "You lack the will to stop me. I am the natural order of things."
          ffmpeg -loglevel error -y -i a.wav -i b.wav -filter_complex "[0]adelay=2000,apad=pad_dur=20[x];[1]adelay=1000,apad=pad_dur=20[y];[x][y]concat=n=2:v=0:a=1,atrim=0:60[a]" -map "[a]" speech.wav
          ffmpeg -loglevel error -y -f lavfi -i "testsrc2=size=1280x536:rate=25:duration=60" -i speech.wav -vf "pad=1280:720:0:92:black" -shortest movie.mp4
      - name: Run all three modes
        env:
          FLIP: mirror
          FLIP_EVERY: "-1"
          LINE_THICKNESS: "1"
          STRETCH_MINUTES: "0.5"
          PART_SECONDS: "30"
          HIGHLIGHT_SECONDS: "15"
          HIGHLIGHT_COUNT: "1"
        run: |
          python3 -c "
          import process as p
          from pathlib import Path
          r = p.process_local(Path('movie.mp4'), 'T', None, Path('out'), Path('work'))
          print({k: len(v) for k, v in r.items()})
          " 2>&1 | tee run.log
          grep -E "spoken language|subtitles:|^    [0-9]|no automatic|Error|Traceback|black bars|\{" run.log | while IFS= read -r l; do echo "::notice::$l"; done
          mkdir /tmp/f && i=0; for f in out/*/*.mp4; do i=$((i+1)); ffmpeg -loglevel error -y -ss 4 -i "$f" -frames:v 1 -vf scale=360:-1 /tmp/f/f$i.png; done
      - name: Save frames
        run: |
          cd /tmp/f && git init -q && git checkout -q -b test-output
          git config user.name test && git config user.email test@example.com
          git add . && git commit -qm frames
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" test-output
